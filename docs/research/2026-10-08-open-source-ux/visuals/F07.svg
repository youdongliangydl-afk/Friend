<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" fill="#f4f6f3"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="40" font-size="25" fill="#26332c" font-weight="600">F07 · 给易变项目事实增加自动再核对机制</text><text x="30" y="68" font-size="14" fill="#5b685f">源码确认机制；故障与模型效果尚待专项复现</text><rect x="30" y="94" width="548" height="310" rx="12" fill="white" stroke="#d4ddd6"/><rect x="620" y="94" width="550" height="310" rx="12" fill="white" stroke="#9fbfac"/><text x="54" y="132" font-size="19" fill="#8d5c40">当前机制／体验</text><text x="644" y="132" font-size="19" fill="#2d7258">建议方案 · 尚未实现</text><line x1="54" y1="150" x2="554" y2="150" stroke="#e5e9e5"/><line x1="644" y1="150" x2="1144" y2="150" stroke="#e5e9e5"/><text x="54" y="194" fill="#26332c" font-size="22">原聊天仍存在</text><text x="54" y="227" fill="#26332c" font-size="22">自动使用过去的脚本／端口</text><text x="54" y="260" fill="#26332c" font-size="22">当前项目可能已经变化</text><text x="644" y="194" fill="#26332c" font-size="22">稳定规则继续有效</text><text x="644" y="227" fill="#26332c" font-size="22">易变观察使用前自动核对</text><text x="644" y="260" fill="#26332c" font-size="22">变更形成新版本与来源</text><path d="M588 248H610M602 242L610 248L602 254" stroke="#6d8275" fill="none" stroke-width="2"/><text x="30" y="439" font-size="15" fill="#5b685f">Friend-Pi c1415c7 · 研究示意，不是优化后应用截图；不表示方案已验证或已实施。</text></g></svg>