<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" fill="#f4f6f3"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="40" font-size="25" fill="#26332c" font-weight="600">V01 · 提高辅助文字与控制标签的可读性</text><text x="30" y="68" font-size="14" fill="#5b685f">静态 CSS 测量＋当前 GUI 观察；非全应用 WCAG 认证</text><rect x="30" y="94" width="548" height="310" rx="12" fill="white" stroke="#d4ddd6"/><rect x="620" y="94" width="550" height="310" rx="12" fill="white" stroke="#9fbfac"/><text x="54" y="132" font-size="19" fill="#8d5c40">当前机制／体验</text><text x="644" y="132" font-size="19" fill="#2d7258">建议方案 · 尚未实现</text><line x1="54" y1="150" x2="554" y2="150" stroke="#e5e9e5"/><line x1="644" y1="150" x2="1144" y2="150" stroke="#e5e9e5"/><text x="54" y="194" fill="#26332c" font-size="22">副文字10px，对比度2.12:1</text><text x="54" y="227" fill="#26332c" font-size="22">模型标签10px，对比度3.15:1</text><text x="54" y="260" fill="#26332c" font-size="22">正常可操作标签显得像禁用</text><text x="644" y="194" fill="#26332c" font-size="22">正文14–15px，标签12–13px</text><text x="644" y="227" fill="#26332c" font-size="22">辅助文字采用中性深灰</text><text x="644" y="260" fill="#26332c" font-size="22">普通文字对比度至少4.5:1</text><path d="M588 248H610M602 242L610 248L602 254" stroke="#6d8275" fill="none" stroke-width="2"/><text x="30" y="439" font-size="15" fill="#5b685f">Friend-Pi c1415c7 · 研究示意，不是优化后应用截图；不表示方案已验证或已实施。</text></g></svg>