<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" fill="#f4f6f3"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="40" font-size="25" fill="#26332c" font-weight="600">V04 · 输入区和图标有足够点击面积，保留简洁控制</text><text x="30" y="68" font-size="14" fill="#5b685f">源码尺寸与实际 GUI；可用性建议</text><rect x="30" y="94" width="548" height="310" rx="12" fill="white" stroke="#d4ddd6"/><rect x="620" y="94" width="550" height="310" rx="12" fill="white" stroke="#9fbfac"/><text x="54" y="132" font-size="19" fill="#8d5c40">当前机制／体验</text><text x="644" y="132" font-size="19" fill="#2d7258">建议方案 · 尚未实现</text><line x1="54" y1="150" x2="554" y2="150" stroke="#e5e9e5"/><line x1="644" y1="150" x2="1144" y2="150" stroke="#e5e9e5"/><text x="54" y="194" fill="#26332c" font-size="22">模式/思考标签9–10px</text><text x="54" y="227" fill="#26332c" font-size="22">部分点击区只有26–34px高</text><text x="54" y="260" fill="#26332c" font-size="22">轮次书签20px，需要很精确</text><text x="644" y="194" fill="#26332c" font-size="22">模式标签12px，按钮32–36px</text><text x="644" y="227" fill="#26332c" font-size="22">图标24px有效命中区</text><text x="644" y="260" fill="#26332c" font-size="22">输入随内容增长，长稿可展开</text><path d="M588 248H610M602 242L610 248L602 254" stroke="#6d8275" fill="none" stroke-width="2"/><text x="30" y="439" font-size="15" fill="#5b685f">Friend-Pi c1415c7 · 研究示意，不是优化后应用截图；不表示方案已验证或已实施。</text></g></svg>