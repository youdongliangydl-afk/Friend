<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">08 · 自动与明确采用专家使用同一权限规则 优化前后示意</title><desc id="desc">两列浅色 Friend-Pi 产品布局示意。左为研究时问题，右为已批准实现范围。机制流程也以示意表达，不是实际界面截图或验收结果。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="1400" height="760" fill="#eef4ef"/><text x="30" y="39" font-size="25" font-weight="650" fill="#293f32"><tspan x="30" dy="0">08 · 自动与明确采用专家使用同一权限规则</tspan></text><text x="30" y="69" font-size="14" font-weight="400" fill="#768279"><tspan x="30" dy="0">历史基线 → 已批准实施范围；所有流程与卡片均为说明示意，不代表真实 Computer Use 通过。</tspan></text><text x="30" y="100" font-size="15" font-weight="600" fill="#a75d45"><tspan x="30" dy="0">优化前 · 研究时状态</tspan></text><text x="710" y="100" font-size="15" font-weight="600" fill="#24744d"><tspan x="710" dy="0">优化后 · 当前源码机制 / 布局</tspan></text><rect x="30" y="116" width="660" height="558" rx="12" fill="#fff" stroke="#dbe5de"/><rect x="30" y="116" width="660" height="45" rx="12" fill="#f3f7f4" stroke="#dbe5de"/><text x="47" y="144" font-size="17" font-weight="650" fill="#293f32"><tspan x="47" dy="0">Friend-Pi</tspan></text><text x="170" y="143" font-size="14" font-weight="400" fill="#293f32"><tspan x="170" dy="0">独立会话   开发项目   + 打开项目</tspan></text><text x="590" y="143" font-size="18" font-weight="400" fill="#293f32"><tspan x="590" dy="0">▤ ⋯ ⋯</tspan></text><line x1="146" y1="161" x2="146" y2="674" stroke="#e1e8e3"/><line x1="450" y1="161" x2="450" y2="674" stroke="#e1e8e3"/><text x="44" y="192" font-size="14" font-weight="650" fill="#293f32"><tspan x="44" dy="0">会话</tspan></text><rect x="40" y="210" width="96" height="45" rx="12" fill="#eaf2ec" stroke="#dbe5de"/><text x="50" y="229" font-size="13" font-weight="400" fill="#293f32"><tspan x="50" dy="0">+ 新会话</tspan></text><text x="45" y="277" font-size="12" font-weight="400" fill="#819185"><tspan x="45" dy="0">搜索名称</tspan></te